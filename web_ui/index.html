<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Launcher</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
      text-align: center;
    }
    img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      margin-bottom: 1rem;
    }
    h2 {
      margin-bottom: 1rem;
    }
    form {
      text-align: left;
    }
    input, button {
      padding: 0.6rem;
      font-size: 1rem;
      width: 100%;
      margin-top: 1rem;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
      text-align: left;
    }
  </style>
</head>
<body>
  <!-- App Icon -->
  <img src="icon.png" alt="App Icon" />

  <h2>Describe your browser task</h2>

  <form id="taskForm">
    <input type="text" id="taskInput" placeholder="e.g. Open LinkedIn job page" required />
    <button type="submit">Submit Task</button>
  </form>

  <div id="status"></div>

  <script>
    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const task = document.getElementById("taskInput").value;
      const res = await fetch("http://localhost:8000/task", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task })
      });
      const data = await res.json();
      document.getElementById("status").textContent = data.status === "success"
        ? "✅ Plan generated and linked!"
        : "❌ Error: " + data.message;
    });
  </script>
</body>
</html>
